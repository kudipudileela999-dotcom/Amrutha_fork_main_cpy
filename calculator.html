<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 60px; }
        input { margin: 6px; padding: 10px; width: 100px; }
        button { margin: 6px; padding: 10px; }
    </style>
</head>
<body>
    <h2>Simple Calculator</h2>
    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number"><br>
    
    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">-</button>
    <button onclick="calculate('*')">*</button>
    <button onclick="calculate('/')">/</button>
    <button onclick="calculate('/')">/</button>
    <button onclick="calculate('**********')">/</button>
    
    <h3 id="result">Result: </h3>

    <script>
        function calculate(operator) {
            let n1 = parseFloat(document.getElementById("num1").value);
            let n2 = parseFloat(document.getElementById("num2").value);
            let res;

            switch(operator) {
                case '+': res = n1 + n2; break;
                case '-': res = n1 - n2; break;
                case '*': res = n1 * n2; break;
                case '/': res = n2 !== 0 ? n1 / n2 : "Error (divide by 0)"; break;
            }
            document.getElementById("result").innerText = "Result: " + res;
        }
    </script>
</body>
</html>
